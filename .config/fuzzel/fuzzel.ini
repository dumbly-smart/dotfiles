[main]
font=Iosevka Nerd Font:size=13
terminal=alacritty -e
prompt=  
icon-theme=Papirus-Dark
icons-enabled=yes
width=48
lines=10
horizontal-pad=24
vertical-pad=16
inner-pad=8
line-height=32
layer=overlay
anchor=center
exit-on-keyboard-focus-loss=no

[colors]
background=131313f2
text=e2e2e2ff
match=c5c5c5ff
selection=393939ff
selection-text=ffffffff
border=e2e2e2ff

[border]
width=1
radius=16
